name: Discord Discussion Comment Notification

on:
  discussion_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "💬 새 댓글이 달렸습니다!",
                "description": "'"${{ github.event.comment.body }}"'",
                "url": "'"${{ github.event.comment.html_url }}"'",
                "color": 5814783,
                "fields": [
                  {
                    "name": "Discussion",
                    "value": "'"${{ github.event.discussion.title }}"'",
                    "inline": true
                  },
                  {
                    "name": "작성자",
                    "value": "'"${{ github.event.comment.user.login }}"'",
                    "inline": true
                  }
                ],
                "timestamp": "'"${{ github.event.comment.created_at }}"'"
              }]
            }'
