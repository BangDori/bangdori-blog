name: "[Design System] Lint"

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'DESIGN.md'
      - '.github/workflows/ci.design-system.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint DESIGN.md
        run: npx -y @google/design.md lint DESIGN.md
