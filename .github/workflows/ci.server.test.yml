name: "[Server] Test"

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/server/**'
      - 'package.json'
      - '.github/workflows/ci.server.test.yml'
      - 'pnpm-lock.yaml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter server build

      - name: Unit Test
        run: pnpm --filter server test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Integration Test
        run: pnpm --filter server test:integration
