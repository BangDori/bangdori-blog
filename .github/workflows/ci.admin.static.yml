name: "[Admin] Static"

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'package.json'
      - '.github/workflows/ci.admin.static.yml'
      - 'biome.json'
      - 'pnpm-lock.yaml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm check:admin:ci

      - name: Lint (ESLint architecture)
        run: pnpm lint:admin:ci

      - name: Unused exports (Knip)
        run: pnpm knip:admin:ci

      - name: Type Check
        run: pnpm --filter admin exec tsc -b

      - name: Build
        run: pnpm build:admin
