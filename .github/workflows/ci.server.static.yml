name: "[Server] Static"

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/server/**'
      - 'packages/db/**'
      - 'package.json'
      - '.github/workflows/ci.server.static.yml'
      - 'biome.json'
      - 'pnpm-lock.yaml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/db
        run: pnpm db:build

      - name: Lint
        run: pnpm check:server:ci

      - name: Type Check
        run: pnpm --filter server exec tsc --noEmit
