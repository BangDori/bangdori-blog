pre-push:
  parallel: true
  commands:
    user-web-biome:
      run: pnpm check:user-web:ci
    admin-biome:
      run: pnpm check:admin:ci
    admin-eslint:
      run: pnpm lint:admin:ci
    admin-knip:
      run: pnpm --filter admin knip:ci
    user-web-knip:
      run: pnpm --filter user-web knip:ci
    server-knip:
      run: pnpm --filter server knip:ci
    admin-circular:
      run: pnpm --filter admin circular:ci
    user-web-circular:
      run: pnpm --filter user-web circular:ci
    server-circular:
      run: pnpm --filter server circular:ci
    server-biome:
      run: pnpm check:server:ci
