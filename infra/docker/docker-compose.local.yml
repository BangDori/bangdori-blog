services:
  user-web:
    build:
      context: ../../
      dockerfile: infra/docker/user-web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://server:4000
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/user-web/.env.development
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ../../
      dockerfile: infra/docker/admin/Dockerfile
    ports:
      - "3001:8080"
    restart: unless-stopped

  server:
    build:
      context: ../../
      dockerfile: infra/docker/server/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env.development
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    env_file:
      - .env.development
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
