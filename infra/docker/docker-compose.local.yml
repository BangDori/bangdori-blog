services:
  user-web:
    build:
      context: ../../
      dockerfile: infra/docker/user-web/Dockerfile
      args:
        NEXT_PUBLIC_NOTION_SITE_URL: https://bangdori.notion.site
        NEXT_PUBLIC_SITE_URL: https://bangdori.kr
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/user-web/.env.development
    restart: unless-stopped

  admin:
    build:
      context: ../../
      dockerfile: infra/docker/admin/Dockerfile
    ports:
      - "3001:8080"
    restart: unless-stopped

  server:
    build:
      context: ../../
      dockerfile: infra/docker/server/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env.development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    env_file:
      - .env.development
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
