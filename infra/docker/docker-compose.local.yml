services:
  user-web:
    build:
      context: ../../
      dockerfile: infra/docker/user-web/Dockerfile
      args:
        NEXT_PUBLIC_NOTION_SITE_URL: ${NEXT_PUBLIC_NOTION_SITE_URL:?NEXT_PUBLIC_NOTION_SITE_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/user-web/.env
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
